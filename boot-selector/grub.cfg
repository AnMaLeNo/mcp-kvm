# Boot selector. If the previous run never recorded its success, do not try
# again: return to the firmware, which starts the next entry of its order.
set timeout=0
load_env -f /EFI/ubuntu/grubenv
if [ "${failed}" = "1" ]; then
  set failed=0
  save_env -f /EFI/ubuntu/grubenv failed
  exit
fi
set failed=1
save_env -f /EFI/ubuntu/grubenv failed
linux /vmlinuz loglevel=4 panic=5 rdinit=/init
initrd /selector.img
boot
